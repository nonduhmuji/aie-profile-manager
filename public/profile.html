<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile | Profile Manager</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <div class="profile-card">
        <h1>My Profile</h1>
        <h2 id="welcomeUser">Welcome!</h2>

        <form id="profileForm">
          <label for="profileUsername">Username</label>
          <input type="text" id="profileUsername" readonly />

          <label for="email">Email Address</label>
          <input type="email" id="email" required />

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" pattern="[0-9]+" required />

          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" required />

          <button type="submit">Save Changes</button>

          <p id="profileMessage" class="message" role="status" hidden></p>
        </form>

        <button type="button" id="logoutButton">Log Out</button>
      </div>
    </main>

    <script src="/profile.js"></script>
  </body>
</html>
